<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>สมุดโทร N3 Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --p:#5C1668; --p2:#7A288A; --g:#F4B41A; --ink:#2B0A33; --mut:#7d6f82; --bg:#F6F1F8; --card:#fff; --line:#eadff0; --soft:#F3EAF6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Anuphan', system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--p); color: #fff; padding: 12px 14px 10px; box-shadow: 0 2px 8px rgba(60,10,70,.25); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .sub { font-size: 12px; color: #f2dff6; }
  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; border: 0; border-radius: 12px; padding: 12px 40px 12px 14px; font: inherit; font-size: 16px; color: var(--ink); outline: none; }
  .search button { position: absolute; right: 6px; top: 6px; border: 0; background: var(--soft); color: var(--p); width: 32px; height: 32px; border-radius: 10px; font-size: 16px; display: none; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; }
  .chip.on { background: var(--g); border-color: var(--g); color: var(--ink); font-weight: 600; }
  select { margin-top: 8px; width: 100%; border: 0; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 14px; color: var(--ink); background: #fff; }
  main { padding: 10px 12px 40px; max-width: 720px; margin: 0 auto; }
  .zones { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 0; scrollbar-width: none; align-items: center; }
  .zones::-webkit-scrollbar { display: none; }
  .zones .zl { flex: 0 0 auto; font-size: 11px; color: rgba(255,255,255,.75); margin-right: 2px; }
  .zc { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.10); color: #fff; border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; }
  .zc.on { background: #fff; border-color: #fff; color: var(--p); font-weight: 700; }
  .zc small { opacity: .7; font-size: 10px; }
  .count { font-size: 12px; color: var(--mut); margin: 4px 2px 8px; }
  .zb { display: inline-block; background: var(--soft); color: var(--p); border-radius: 6px; padding: 1px 6px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .srv { margin-top: 18px; }
  .srv .hint { font-size: 12px; color: var(--mut); margin: 6px 2px 0; line-height: 1.6; }
  .srv .ldg { font-size: 13px; color: var(--mut); padding: 10px 2px; }
  .elsew { display: block; width: 100%; margin-top: 10px; background: var(--soft); color: var(--p); border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; }
  .sect { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 14px 2px 8px; }
  .sect h2 { margin: 0; font-size: 16px; color: var(--p); }
  .sect span { font-size: 12px; color: var(--mut); white-space: nowrap; }
  .card { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(90,30,100,.08); }
  .card.me { outline: 2px solid var(--g); }
  .av { position: relative; flex: 0 0 48px; height: 48px; border-radius: 50%; background: var(--soft); color: var(--p); display: grid; place-items: center; font-weight: 700; font-size: 18px; border: 2px solid var(--g); overflow: hidden; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; opacity: 0; transition: opacity .2s; }
  .av img.ok { opacity: 1; }
  .av.v { border-color: var(--line); color: var(--mut); }
  .info { flex: 1; min-width: 0; }
  .nm { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .nm small { font-weight: 400; color: var(--mut); font-size: 12px; }
  .pos { display: inline-block; margin-top: 3px; background: var(--g); color: var(--ink); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600; }
  .pos.hp { background: var(--soft); color: var(--p); }
  .unit { font-size: 13px; color: var(--p2); margin-top: 3px; line-height: 1.35; }
  .tel { font-size: 12px; color: var(--mut); margin-top: 3px; }
  .self { display: inline-block; margin-top: 5px; font-size: 12px; color: var(--p); font-weight: 600; text-decoration: none; }
  .acts { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .call { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--p); color: #fff; text-decoration: none; font-size: 18px; }
  .mini { display: flex; gap: 4px; }
  .ib { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--p); font-size: 14px; padding: 0; display: grid; place-items: center; }
  .ib.on { background: var(--g); border-color: var(--g); }
  .more { display: block; width: 100%; margin: 6px 0; border: 1px solid var(--line); background: #fff; color: var(--p); border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; }
  .banner { display: block; background: #fff8e6; border: 1px solid #f4dc9a; color: var(--ink); border-radius: 14px; padding: 12px 14px; margin: 6px 0 4px; text-decoration: none; font-size: 14px; }
  .banner b { color: var(--p); }
  details.grp { background: #fff; border-radius: 14px; margin-bottom: 8px; padding: 0 8px; box-shadow: 0 1px 4px rgba(90,30,100,.06); }
  details.grp summary { list-style: none; padding: 12px 6px; font-weight: 600; color: var(--p); display: flex; justify-content: space-between; gap: 8px; }
  details.grp summary::-webkit-details-marker { display: none; }
  details.grp summary::after { content: '▾'; color: var(--mut); }
  details.grp[open] summary::after { content: '▴'; }
  details.grp .card { box-shadow: none; border: 1px solid var(--line); }
  .state { text-align: center; padding: 48px 20px; color: var(--mut); }
  .state h2 { color: var(--ink); font-size: 17px; margin: 10px 0 6px; }
  .state .big { font-size: 40px; }
  .btn { display: inline-block; margin-top: 16px; background: var(--p); color: #fff; text-decoration: none; border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 600; }
  .sk { height: 72px; border-radius: 14px; margin-bottom: 8px; background: linear-gradient(90deg, #efe6f2 25%, #f8f3fa 50%, #efe6f2 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; max-width: 90vw; }
  .toast.on { opacity: .95; }
  .foot { text-align: center; font-size: 11px; color: var(--mut); margin-top: 16px; line-height: 1.8; }
  .foot a { color: var(--p); font-weight: 600; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<header id="hdr">
  <div class="top"><h1>📞 สมุดโทร N3 Connect</h1><span class="sub" id="asof"></span></div>
  <div class="search"><input id="q" type="text" inputmode="search" autocomplete="off" placeholder="ค้นชื่อ ชื่อเล่น ตำแหน่ง หน่วย หรือเบอร์"><button id="clr" aria-label="ล้าง">✕</button></div>
  <div class="zones" id="zones" hidden></div>
  <div class="chips" id="chips"></div>
  <select id="grp" aria-label="เลือกหน่วยงาน"><option value="">ทุกหน่วยงาน</option></select>
</header>
<main id="main"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<div class="toast" id="toast"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
'use strict';
// ค่าเหล่านี้ไม่ใช่ความลับ (LIFF ID / URL บอท) — ถ้าไม่มี ID token ที่ผ่านการตรวจ บอทจะไม่ส่งข้อมูลให้
const LIFF_ID = '2012356608-WZdvLgcd';
const API_URL = 'https://script.google.com/macros/s/AKfycbzRRsudr5IUzUZR3942N00S2v_n3wlTqi0zXl_LnZrbC9_YmcOr9s0Db_XTfaCJ5kfO/exec';
const PAGE = 30, HOME_EXEC = 15, SS_KEY = 'n3pb_v2', SS_CHIP = 'n3pb_chip', SS_ZONE = 'n3pb_zone';
const QWAIT = 350, QMIN = 2;   // I-25: หน่วงก่อนยิงค้นฝั่งเซิร์ฟเวอร์ · คำค้นสั้นกว่านี้ไม่ยิง
const T0 = Date.now();

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().replace(/[\s.\-()]/g, '').replace(/ฯ/g, '');
const digits = s => String(s || '').replace(/\D/g, '');
// sessionStorage = จำได้แค่รอบการเปิดนี้ (ไม่เก็บรายชื่อถาวร) · ห่อ try/catch ทุกครั้ง
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };

const CHIPS = [['home', '🏠 หน้าแรก'], ['fav', '⭐ โปรด'], ['all', 'ทั้งหมด'], ['exec', 'ผู้บริหารเขต'], ['mgr', 'ผจก.'], ['hp', 'หผ.'], ['kfs', 'กฟส.'], ['kfj', 'กฟจ.']];
// ลำดับตำแหน่ง (บนลงล่าง) · ตำแหน่งเดียวกันเรียงระดับ (เลขในวงเล็บ) มาก→น้อย · ที่เหลือคงลำดับเดิมในชีต
const RANKS = ['ผชก', 'อฝ', 'รฝ', 'อก', 'รก', 'ชก', 'ผจก', 'รจก', 'ชจก', 'หผ', 'ชผ'];
function rankOf(pos) {
  const x = String(pos || '').replace(/\s/g, '');
  let i = RANKS.findIndex(r => x.indexOf(r) === 0);
  if (i < 0) i = RANKS.length;
  const lv = (x.split(/รษ\./)[0].match(/\((\d+)\)/g) || []).map(m => +m.replace(/\D/g, ''));
  return i * 100 - (lv.length ? Math.max.apply(null, lv) : 0);
}
const byRank = (a, b) => a._rk - b._rk || a._i - b._i;

const OPEN = {};   // จำกลุ่มแผนกที่เปิด/ปิดไว้ระหว่างวาดใหม่
let PEOPLE = [], POOL = [], MINE = null, LINKED = false, FAVS = new Set(), OAMSG = '', TOKEN = '';
let chip = ss.get(SS_CHIP) || 'home', group = '', shown = PAGE, showAll = false, ready = false;
if (!CHIPS.some(c => c[0] === chip)) chip = 'home';
// I-25 · เขต: zone = เขตที่เลือกอยู่ ('all' = ทุกเขต) · HZ = เขตบ้านของบอท (คนในเขตนี้ไม่ส่งฟิลด์ z มา)
let ZONES = [], MYZONE = '', HZ = 'น3', zone = '', QRES = null, QBUSY = false, qSeq = 0, qTimer = 0;
const zoneOf = p => p.z || HZ;
const zoneName = z => 'กฟ' + String(z).charAt(0) + '.' + String(z).slice(1);

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
function state(icon, title, msg, btnHtml) {
  $('hdr').hidden = true;
  $('main').innerHTML = '<div class="state"><div class="big">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p>' + (btnHtml || '') + '</div>';
}
const oa = text => OAMSG ? OAMSG + encodeURIComponent(text) : '';

async function start() {
  setupUI();
  const cached = ss.get(SS_KEY);
  if (cached) { try { apply(JSON.parse(cached), true); } catch (e) {} }   // เปิดซ้ำในรอบเดียวกัน → แสดงทันที แล้วอัปเดตเบื้องหลัง
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    TOKEN = liff.getIDToken();
    if (!TOKEN) { state('🔒', 'เข้าสู่ระบบไม่สำเร็จ', 'ลองปิดหน้านี้แล้วเปิดใหม่จากเมนู N3 Connect'); return; }
    const d = await api({ action: 'liffPhonebook', idToken: TOKEN });
    if (!d.ok) return denied(d);
    ss.set(SS_KEY, JSON.stringify(d));
    apply(d, false);
    console.log('[N3PB] โหลด ' + ((Date.now() - T0) / 1000).toFixed(1) + ' วิ · ' + POOL.length + ' รายชื่อ');
  } catch (e) {
    if (!ready) state('⚠️', 'เปิดสมุดโทรไม่สำเร็จ', 'ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่อีกครั้ง', '<button class="btn" onclick="location.reload()">ลองใหม่</button>');
  }
}
async function api(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}

function denied(d) {
  ss.del(SS_KEY);
  if (d.error === 'not_friend') {
    const add = d.oa ? '<a class="btn" href="' + esc(d.oa) + '">➕ เพิ่มเพื่อน N3 Connect</a>' : '';
    state('🔒', 'ใช้ได้เฉพาะเพื่อนของ N3 Connect', 'เพิ่มเพื่อน LINE "N3 Connect" (และลงทะเบียนถ้าระบบขอ) แล้วเปิดหน้านี้ใหม่อีกครั้ง', add);
  } else if (d.error === 'bad_token' || d.error === 'no_token') {
    state('🔒', 'การเข้าสู่ระบบหมดอายุ', 'กดลองใหม่เพื่อเข้าสู่ระบบอีกครั้ง', '<button class="btn" onclick="liff.logout();location.reload()">ลองใหม่</button>');
  } else {
    state('⚠️', 'ระบบไม่พร้อมใช้งานชั่วคราว', 'ลองใหม่อีกครั้งในอีกสักครู่', '<button class="btn" onclick="location.reload()">ลองใหม่</button>');
  }
}

function prep(p, i) {
  const full = [p.name, p.surname].filter(Boolean).join(' ');
  p._full = full; p._i = i; p._rk = rankOf(p.pos);
  p._key = norm([full, p.nickname, p.pos, p.posFull, p.unit, p.group, p.sec].join(' '));
  p._tel = digits(p.mobile) + ' ' + digits(p.sat) + ' ' + digits(p.ext);
  const pos = String(p.pos || '');
  p._mgr = /^(ผจก|รจก|ชจก)/.test(pos);
  p._hp = /^หผ/.test(pos);
  p._exec = p.k === 'c' && /สำนักงานเขต/.test(p.group || '');
  p._kfs = /^กฟส\./.test(p.unit || '');
  p._kfj = /^กฟจ\./.test(p.unit || '') || /^กฟจ\./.test(p.group || '');
  return p;
}
function apply(d, fromCache) {
  PEOPLE = (d.people || []).map(prep).sort(byRank);
  MINE = d.mine || null; LINKED = !!d.linked; OAMSG = d.oaMsg || ''; FAVS = new Set(d.favs || []);
  HZ = d.hz || HZ; MYZONE = d.myZone || HZ; ZONES = d.zones || [];
  if (!zone) { const keep = ss.get(SS_ZONE); zone = (keep === 'all' || ZONES.some(z => z.z === keep)) ? keep : MYZONE; }   // เปิดใหม่ = เขตตัวเอง · ในรอบเดิมจำที่เลือกไว้
  drawZones();
  POOL = PEOPLE.slice();
  if (MINE) {   // คนในหน่วยของฉันค้นได้ด้วย (ไม่ซ้ำกับทั้งเล่ม)
    const have = new Set(PEOPLE.map(p => p.id));
    let n = PEOPLE.length;
    MINE.groups.forEach(g => { g.people = g.people.map(p => prep(p, n++)).sort(byRank); g.people.forEach(p => { if (!have.has(p.id)) { POOL.push(p); have.add(p.id); } }); });
  }
  $('asof').textContent = d.at ? 'ข้อมูล ' + d.at + (fromCache ? ' ⟳' : '') : '';
  const groups = [...new Set(PEOPLE.filter(inZone).map(p => p.group).filter(Boolean))];
  $('grp').innerHTML = '<option value="">ทุกหน่วยงาน</option>' + groups.map(g => '<option' + (g === group ? ' selected' : '') + '>' + esc(g) + '</option>').join('');
  ready = true; $('hdr').hidden = false;
  render();
}

function drawZones() {
  const list = ZONES.filter(z => z.chip);
  if (list.length < 2) { $('zones').hidden = true; return; }   // มีเขตเดียว = ไม่ต้องให้เลือก
  const b = (k, label, sub) => '<button class="zc' + (k === zone ? ' on' : '') + '" data-z="' + esc(k) + '">' + esc(label) + (sub ? ' <small>' + esc(sub) + '</small>' : '') + '</button>';
  $('zones').innerHTML = '<span class="zl">เขต</span>' +
    list.map(z => b(z.z, z.name, z.z === MYZONE ? 'เขตฉัน' : '')).join('') + b('all', 'ทุกเขต', '');
  $('zones').hidden = false;
}
function setZone(z) {
  if (z === zone) return;
  zone = z; ss.set(SS_ZONE, z); shown = PAGE; QRES = null; qSeq++;   // ยกเลิกผลค้นเก่า
  [...$('zones').children].forEach(x => { if (x.dataset.z) x.classList.toggle('on', x.dataset.z === zone); });
  const groups = [...new Set(PEOPLE.filter(inZone).map(p => p.group).filter(Boolean))];
  if (group && groups.indexOf(group) < 0) { group = ''; }
  $('grp').innerHTML = '<option value="">ทุกหน่วยงาน</option>' + groups.map(g => '<option' + (g === group ? ' selected' : '') + '>' + esc(g) + '</option>').join('');
  render(); askServer(); window.scrollTo(0, 0);
}
const inZone = p => zone === 'all' || zoneOf(p) === zone;

function setupUI() {
  $('chips').innerHTML = CHIPS.map(([k, l]) => '<button class="chip' + (k === chip ? ' on' : '') + '" data-k="' + k + '">' + l + '</button>').join('');
  $('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) setChip(b.dataset.k); };
  $('zones').onclick = e => { const b = e.target.closest('.zc'); if (b) setZone(b.dataset.z); };
  $('grp').onchange = () => { group = $('grp').value; shown = PAGE; render(); };
  let t; $('q').oninput = () => {
    $('clr').style.display = $('q').value ? 'block' : 'none';
    QRES = null; qSeq++;   // คำค้นเปลี่ยน = ทิ้งผลเก่าทันที
    clearTimeout(t); t = setTimeout(() => { shown = PAGE; render(); }, 250);
    clearTimeout(qTimer); qTimer = setTimeout(askServer, QWAIT);
  };
  $('clr').onclick = () => clearSearch();
  $('main').onclick = onMainClick;
  $('main').addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.grp')) OPEN[d.dataset.sec] = d.open; }, true);
}
function setChip(k) {
  chip = k; shown = PAGE; showAll = false; ss.set(SS_CHIP, k);
  if (k === 'fav') { QRES = null; QBUSY = false; qSeq++; clearTimeout(qTimer); }   // ชิปโปรด = เฉพาะรายการในมือ
  [...$('chips').children].forEach(x => x.classList.toggle('on', x.dataset.k === chip));
  render(); window.scrollTo(0, 0);
}
async function askServer() {   // I-25 · ค้นพนักงานทุกระดับที่หน้าเว็บไม่มีในมือ
  const raw = $('q').value.trim();
  const my = ++qSeq;
  if (!ready || !TOKEN || raw.length < QMIN || chip === 'fav') { QBUSY = false; return; }
  const d9 = digits(raw);
  if (/^[\d\s\-()+]+$/.test(raw) && d9.length < 4) { QBUSY = false; return; }   // เบอร์ต้อง ≥4 หลัก (กติกาเดียวกับเซิร์ฟเวอร์)
  QBUSY = true; render();
  let d;
  try { d = await api({ action: 'liffPhonebook', idToken: TOKEN, op: 'search', q: raw, zone: zone }); }
  catch (e) { d = { ok: false, error: 'net' }; }
  if (my !== qSeq) return;   // พิมพ์ต่อ/เปลี่ยนเขตระหว่างรอ = ทิ้งผลนี้
  QBUSY = false;
  QRES = d && d.ok ? { people: (d.people || []).map(prep), n: d.n || 0, more: !!d.more, elsewhere: d.elsewhere || [], zone: d.zone }
                   : { error: (d && d.error) || 'net', people: [], elsewhere: [] };
  render();
}
function srvBlock() {
  if (QBUSY) return '<div class="srv"><div class="ldg">⏳ กำลังค้นพนักงานทั้งหมด…</div></div>';
  if (!QRES) return '';
  if (QRES.error === 'slow_down') return '<div class="srv"><div class="hint">⏳ ค้นถี่เกินไป รอสักครู่แล้วลองใหม่</div></div>';
  if (QRES.error) return QRES.error === 'bad_q' ? '' : '<div class="srv"><div class="hint">⚠️ ค้นพนักงานทั้งหมดไม่สำเร็จ ลองใหม่อีกครั้ง</div></div>';
  if (!QRES.people.length) {
    if (!QRES.elsewhere.length) return '';
    const e = QRES.elsewhere, tot = e.reduce((a, x) => a + x.n, 0);
    return '<div class="srv"><button class="elsew" data-act="zall">🔎 ไม่พบใน' + esc(zoneName(zone)) + ' แต่พบที่ ' +
      esc(e.map(x => x.name + ' ' + x.n + ' คน').join(' · ')) + ' — แตะเพื่อค้นทุกเขต (' + tot + ')</button></div>';
  }
  const t = '👥 พนักงานทั้งหมด · ' + (zone === 'all' ? 'ทุกเขต' : zoneName(zone));
  return '<div class="srv"><div class="sect"><h2>' + esc(t) + '</h2><span>' + QRES.people.length +
    (QRES.more ? ' จาก ' + QRES.n.toLocaleString('th-TH') : '') + ' คน</span></div>' +
    QRES.people.sort(byRank).map(card).join('') +
    (QRES.more ? '<div class="hint">พิมพ์ให้เจาะจงขึ้นเพื่อดูคนที่เหลือ (แสดงได้สูงสุด ' + PAGE + ' คนต่อครั้ง)</div>' : '') + '</div>';
}

function clearSearch() { $('q').value = ''; $('clr').style.display = 'none'; group = ''; $('grp').value = ''; shown = PAGE;
  QRES = null; QBUSY = false; qSeq++; clearTimeout(qTimer); render(); $('q').focus(); }

function match(p, toks, dq) {
  if (!inZone(p)) return false;
  if (chip === 'fav' && !FAVS.has(p.id)) return false;
  if (chip === 'exec' && !p._exec) return false;
  if (chip === 'mgr' && !p._mgr) return false;
  if (chip === 'hp' && !p._hp) return false;
  if (chip === 'kfs' && !p._kfs) return false;
  if (chip === 'kfj' && !p._kfj) return false;
  if (group && p.group !== group) return false;
  if (dq) return p._tel.indexOf(dq) >= 0;
  return toks.every(t => p._key.indexOf(t) >= 0);
}

function render() {
  if (!ready) return;
  const raw = $('q').value.trim();
  if (!raw && chip === 'home' && !group && !showAll) { QRES = null; return renderHome(); }
  const dq = digits(raw).length >= 4 && digits(raw).length >= raw.replace(/\s/g, '').length - 3 ? digits(raw) : '';
  const toks = raw.split(/\s+/).map(norm).filter(Boolean);
  const list = POOL.filter(p => match(p, toks, dq)).sort(byRank);
  const empty = chip === 'fav' && !raw
    ? '<div class="state"><div class="big">⭐</div><h2>ยังไม่มีรายชื่อโปรด</h2><p>กดปุ่ม ☆ ที่การ์ดของคนที่โทรหาบ่อย (รายการเดียวกับในแชต)</p></div>'
    : '<div class="state"><div class="big">🔍</div><h2>ไม่พบรายชื่อ</h2><p>ลองพิมพ์ชื่อเล่น นามสกุล ตำแหน่ง หรือชื่อหน่วย</p><button class="btn" data-act="clear">ล้างการค้นหา</button></div>';
  const srv = srvBlock();
  const none = !list.length && !srv;   // ไม่พบทั้งในมือและที่เซิร์ฟเวอร์ ค่อยขึ้นจอว่าง
  $('main').innerHTML = (list.length ? '<div class="count">พบ ' + list.length.toLocaleString('th-TH') + ' รายการ</div>' + list.slice(0, shown).map(card).join('') : (none ? empty : '')) +
    (list.length > shown ? '<button class="more" data-act="more">แสดงเพิ่ม (' + (list.length - shown) + ')</button>' : '') + srv + foot();
}
function renderHome() {
  let h = '';
  if (MINE && MINE.groups.length) {
    h += '<div class="sect"><h2>🏠 หน่วยของฉัน · ' + esc(MINE.unit) + '</h2><span>' + MINE.n + ' คน</span></div>';
    if (MINE.groups.length === 1) h += MINE.groups[0].people.map(card).join('');
    else h += MINE.groups.map(g => '<details class="grp" data-sec="' + esc(g.sec) + '"' + ((OPEN[g.sec] != null ? OPEN[g.sec] : g.mine) ? ' open' : '') + '><summary><span>' + esc(g.sec) + (g.mine ? ' (แผนกของฉัน)' : '') + '</span><span>' + g.people.length + ' คน</span></summary>' + g.people.map(card).join('') + '</details>').join('');
  } else if (!LINKED && OAMSG) {
    h += '<a class="banner" href="' + esc(oa('ผูกบัญชี')) + '">🔗 <b>ผูกบัญชี</b> เพื่อดูเบอร์ทุกคนใน<b>หน่วยของคุณ</b> ที่หน้าแรกนี้ ›</a>';
  }
  const ex = PEOPLE.filter(p => p.k === 'c' && p.name && inZone(p)).slice(0, HOME_EXEC);
  if (ex.length) h += '<div class="sect"><h2>👔 ผู้บริหาร' + (zone !== 'all' && zone !== HZ ? ' · ' + esc(zoneName(zone)) : '') + '</h2><span>' + ex.length + ' คนแรกตามตำแหน่ง</span></div>' + ex.map(card).join('');
  h += '<button class="more" data-act="all">ดูรายชื่อทั้งหมด (' + POOL.filter(inZone).length.toLocaleString('th-TH') + ')</button>' + foot();
  $('main').innerHTML = h;
}
function foot() {
  return '<div class="foot">' + (OAMSG ? '<a href="' + esc(oa('ข้อมูลของฉัน')) + '">✏️ แจ้งแก้ข้อมูลของฉัน</a><br>' : '') + 'N3 Connect · ข้อมูลชุดเดียวกับที่ค้นในแชต</div>';
}

function card(p) {
  const vac = !p.name;
  const ini = vac ? '–' : esc(String(p.name).charAt(0) + (p.surname ? String(p.surname).charAt(0) : ''));
  // รูป: แสดงตัวย่อก่อนเสมอ แล้วค่อยซ้อนรูปเมื่อโหลดเสร็จ · โหลดไม่ขึ้น → ตัดรูปทิ้ง เหลือตัวย่อ
  const img = !vac && p.photo ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add(\'ok\')" onerror="this.remove()">' : '';
  const tel = digits(p.mobile);
  const zb = p.z && p.z !== MYZONE ? '<span class="zb">' + esc(zoneName(p.z)) + '</span>' : '';   // คนนอกเขตตัวเองติดป้ายให้เห็นชัด
  const nm = (vac ? '<span style="color:var(--mut)">(ตำแหน่งว่าง)</span>'
    : esc(p._full) + (p.nickname ? ' <small>(' + esc(p.nickname) + ')</small>' : '')) + zb;
  const pos = esc((p.st === 'รักษาการ' ? 'รักษาการ ' : '') + (p.pos || '')) + (p.sec ? ' ' + esc(p.sec) : '');
  const tels = [p.mobile ? '📱 ' + esc(p.mobile) : '', p.sat ? '📡 ' + esc(p.sat) : '', p.ext ? '☎️ ' + esc(p.ext) : ''].filter(Boolean).join('  ');
  const copyNo = p.mobile || p.sat || p.ext || '';
  const isFav = FAVS.has(p.id);
  const fav = !vac && p.id ? '<button class="ib' + (isFav ? ' on' : '') + '" data-act="fav" data-id="' + esc(p.id) + '" aria-label="รายชื่อโปรด">' + (isFav ? '★' : '☆') + '</button>' : '';
  const cp = copyNo ? '<button class="ib" data-act="copy" data-v="' + esc(copyNo) + '" aria-label="คัดลอกเบอร์">📋</button>' : '';
  return '<div class="card' + (p.self ? ' me' : '') + '"><div class="av' + (vac ? ' v' : '') + '">' + ini + img + '</div><div class="info">' +
    '<div class="nm">' + nm + '</div>' +
    (pos ? '<span class="pos' + (p._hp ? ' hp' : '') + '">' + pos + '</span>' : '') +
    '<div class="unit">' + esc(p.unit || '') + '</div>' +
    (tels ? '<div class="tel">' + tels + '</div>' : '') +
    (p.self && OAMSG ? '<a class="self" href="' + esc(oa('ข้อมูลของฉัน')) + '">นี่คือคุณ · ✏️ แจ้งแก้ข้อมูล</a>' : '') +
    '</div><div class="acts">' +
    (tel.length >= 9 ? '<a class="call" href="tel:' + tel + '" aria-label="โทรมือถือ">📞</a>' : '') +
    ((cp || fav) ? '<div class="mini">' + cp + fav + '</div>' : '') +
    '</div></div>';
}

function onMainClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'more') { shown += PAGE; render(); }
  else if (a === 'all') { showAll = true; chip = 'all'; ss.set(SS_CHIP, 'all'); [...$('chips').children].forEach(x => x.classList.toggle('on', x.dataset.k === chip)); shown = PAGE; render(); window.scrollTo(0, 0); }
  else if (a === 'zall') { setZone('all'); }
  else if (a === 'clear') clearSearch();
  else if (a === 'copy') copyText(b.dataset.v);
  else if (a === 'fav') toggleFav(b.dataset.id);
}
function copyText(v) {
  const ok = () => toast('คัดลอก ' + v + ' แล้ว');
  const fb = () => { const t = document.createElement('textarea'); t.value = v; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); ok(); } catch (e) { toast('คัดลอกไม่สำเร็จ'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, fb); else fb();
}
async function toggleFav(id) {
  if (!TOKEN) { toast('รอสักครู่ กำลังเชื่อมต่อ…'); return; }
  const was = FAVS.has(id);
  if (was) FAVS.delete(id); else FAVS.add(id);
  const y = window.scrollY; render(); window.scrollTo(0, y);
  toast(was ? 'นำออกจากรายชื่อโปรดแล้ว' : '⭐ เพิ่มในรายชื่อโปรดแล้ว');
  try {
    const d = await api({ action: 'liffPhonebook', idToken: TOKEN, op: 'fav', id });
    if (!d.ok) throw new Error(d.error);
    FAVS = new Set(d.favs || []);
    try { const c = JSON.parse(ss.get(SS_KEY) || 'null'); if (c) { c.favs = d.favs; ss.set(SS_KEY, JSON.stringify(c)); } } catch (e) {}
  } catch (e) { if (was) FAVS.add(id); else FAVS.delete(id); toast('บันทึกรายชื่อโปรดไม่สำเร็จ ลองใหม่'); }
  const y2 = window.scrollY; render(); window.scrollTo(0, y2);
}

start();
</script>
</body>
</html>
